name: Database CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database_ci.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database_ci.yml"

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Supabase CLI
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Run database security tests
        run: npx supabase test db

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
